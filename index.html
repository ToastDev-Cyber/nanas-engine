<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nanas Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Nanas Engine</h1>
    <div class="controls">
        <input type="color" id="colorPicker">
        <input type="range" id="lineWidth" min="1" max="20" value="5">
        <button onclick="activeTool='brush'">Brush</button>
        <button onclick="activeTool='erase'">Eraser</button>
        <button onclick="invertColors()">Invert</button>
        <button id="clearBtn">Clear</button>
        <button id="saveBtn">Download</button>
    </div>
    <canvas id="paintCanvas" width="800" height="500"></canvas>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanas Engine - Paint App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Workspace Container -->
    <div id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Top Floating Toolbar Wrapper -->
    <div id="toolbar">
        <!-- 🍍 Small Nanas Engine Branding Logo -->
        <div id="logoContainer">
            <img src="logo.png" alt="Nanas Engine Logo" id="engineLogo">
        </div>

        <div class="tool-section separator">
            <button id="brushTool" class="tool-btn active">🖌️ Brush</button>
            <button id="bucketTool" class="tool-btn">🪣 Bucket</button>
            <button id="squareTool" class="tool-btn">⬜ Square</button>
            <button id="circleTool" class="tool-btn">⭕ Circle</button>
            <button id="textTool" class="tool-btn">🔤 Text</button>
        </div>

        <div class="tool-section separator">
            <input type="color" id="colorPicker" value="#000000" title="Select Paint Color">
            <div class="slider-group">
                <input type="range" id="brushSize" min="5" max="100" value="20">
                <span id="sizeVal">20px</span>
            </div>
        </div>

        <!-- Font Selector Panel (Only reveals when Text tool is active) -->
        <div id="fontSelectorGroup" class="tool-section" style="display: none;">
            <label for="fontSelect">Font:</label>
            <select id="fontSelect">
                <option value="sans-serif">System Sans-Serif</option>
                <!-- Edo SZ is injected right here automatically by app.js -->
            </select>
        </div>

        <!-- 📂 Import/Export File Management Group -->
        <div class="tool-section separator right-align">
            <!-- Hidden native loader node triggered via custom UI button skin -->
            <input type="file" id="imageImporter" accept="image/png, image/jpeg, image/webp" style="display: none;">
            <button id="importBtn" class="action-btn import-style">📂 Import Image</button>
            
            <div class="format-group">
                <select id="exportFormat" title="Choose file format type">
                    <option value="image/png">.PNG (Lossless)</option>
                    <option value="image/jpeg">.JPG (Compressed)</option>
                    <option value="image/webp">.WEBP (Modern)</option>
                </select>
                <button id="exportBtn" class="action-btn export-style">💾 Export</button>
            </div>
            
            <button id="clearBtn" class="action-btn clear-style">🗑️ Clear</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

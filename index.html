<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanas Engine v3.0 - Full Layer Matrix</title>
    <style>
        /* CSS remains optimized for the Layer Matrix UI */
        body { background-color: #1e1e24; color: #f5f5f7; display: flex; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        #sidebar { width: 300px; background-color: #2b2b36; border-right: 2px solid #3d3d4f; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .layer-item { background: #3d3d4f; padding: 8px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .layer-item.active { border: 1px solid #ffb703; }
        canvas { background-color: white; cursor: crosshair; }
        #canvas-viewport { flex: 1; display: flex; justify-content: center; align-items: center; background: #121214; }
        button { cursor: pointer; padding: 8px; border-radius: 4px; border: none; background: #3d3d4f; color: white; }
        button:hover { background: #4e4e66; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Nanas Engine</h2>
    <button onclick="requestNewLayerCreation()">➕ Add Layer</button>
    <div id="layersContainer"></div>
    <hr style="width:100%">
    <button onclick="saveProject()">💾 Export (.nns)</button>
    <input type="file" id="importFile" accept=".nns" style="display:none" onchange="loadProject(event)">
    <button onclick="document.getElementById('importFile').click()">📂 Load (.nns)</button>
</div>

<div id="canvas-viewport">
    <canvas id="paintCanvas" width="800" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let layers = [];
    let activeLayer = null;
    let history = []; // NNS Data Stream

    function createLayer(name) {
        const c = document.createElement('canvas');
        c.width = canvas.width; c.height = canvas.height;
        const layer = { id: Date.now().toString(), name, canvas: c, ctx: c.getContext('2d'), visible: true };
        layers.push(layer);
        activeLayer = layer;
        renderLayerList();
        draw();
    }

    function requestNewLayerCreation() {
        const name = prompt("Enter Layer Name:", "Layer " + (layers.length + 1));
        if (name) createLayer(name);
    }

    function renameLayer(id) {
        const layer = layers.find(l => l.id === id);
        const newName = prompt("Rename layer:", layer.name);
        if (newName) {
            layer.name = newName;
            renderLayerList();
        }
    }

    function renderLayerList() {
        const container = document.getElementById('layersContainer');
        container.innerHTML = '';
        [...layers].reverse().forEach(l => {
            const div = document.createElement('div');
            div.className = `layer-item ${activeLayer.id === l.id ? 'active' : ''}`;
            div.innerHTML = `<span onclick="activeLayer=layers.find(x=>x.id==='${l.id}'); renderLayerList()">${l.name}</span>
                             <button onclick="renameLayer('${l.id}')">✏️</button>`;
            container.appendChild(div);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        layers.forEach(l => { if (l.visible) ctx.drawImage(l.canvas, 0, 0); });
    }

    // NNS Export Protocol
    function saveProject() {
        const data = {
            version: "3.0",
            layers: layers.map(l => ({ name: l.name, data: l.canvas.toDataURL() })),
            history: history
        };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "project.nns";
        a.click();
    }

    // NNS Import Protocol
    function loadProject(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const json = JSON.parse(event.target.result);
            layers = [];
            json.layers.forEach(l => {
                const img = new Image();
                img.onload = () => {
                    createLayer(l.name);
                    activeLayer.ctx.drawImage(img, 0, 0);
                    draw();
                };
                img.src = l.data;
            });
        };
        reader.readAsText(e.target.files[0]);
    }

    // Init
    createLayer("Background");
</script>
</body>
</html>

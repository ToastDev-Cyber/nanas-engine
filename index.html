<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencil OS - Creative Studio</title>
    <style>
        :root {
            --bg-dark: #121214;
            --sidebar-bg: #1a1a1e;
            --panel-bg: #26262b;
            --accent-blue: #4a90e2;
            --text-main: #e2e2e9;
            --text-muted: #8e8e93;
            --active-tool: #3a3a42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            color: var(--text-main);
        }

        /* 🎛️ Sidebar Layout Panels */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #2d2d34;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 20px;
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #2d2d34;
            color: var(--accent-blue);
        }

        .section-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tool-btn {
            background-color: var(--panel-bg);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background-color: #32323a;
        }

        .tool-btn.active {
            background-color: var(--active-tool);
            border-color: var(--accent-blue);
        }

        /* 🎚️ Settings Configurations */
        .slider-group, .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 6px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 36px;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #444;
            border-radius: 4px;
        }

        select {
            background: #121214;
            color: var(--text-main);
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            width: 100%;
        }

        /* 💾 File & Export Controls */
        .file-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-btn {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid #3e3e46;
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #3e3e46;
        }

        #clearBtn {
            background-color: #722c2c;
            border-color: #923c3c;
        }

        #clearBtn:hover {
            background-color: #8a3535;
        }

        /* 🎨 Workspace Canvas Viewport */
        #canvasContainer {
            flex-grow: 1;
            position: relative;
            background-color: #1e1e24;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            cursor: crosshair;
        }

        /* 🔤 Interactive Textbox System */
        .canvas-textarea {
            position: absolute;
            background: transparent;
            border: 1px dashed var(--accent-blue);
            color: white;
            outline: none;
            resize: none;
            overflow: hidden;
            font-family: sans-serif;
            line-height: 1.1;
            padding: 0;
            margin: 0;
            white-space: pre;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand">PENCIL OS ENGINE</div>

        <!-- 🛠️ Main Toolkit Grid -->
        <div>
            <div class="section-title">Studio Tools</div>
            <div class="tool-grid">
                <button class="tool-btn active" id="brushTool">🖌️ Brush</button>
                <button class="tool-btn" id="pencilTool">✏️ Pencil</button>
                <button class="tool-btn" id="eraserTool">🧽 Eraser</button>
                <button class="tool-btn" id="eyedropperTool">🧪 Drop</button>
                <button class="tool-btn" id="bucketTool">🪣 Bucket</button>
                <button class="tool-btn" id="lineTool">📏 Line</button>
                <button class="tool-btn" id="triangleTool">🔺 Tri</button>
                <button class="tool-btn" id="squareTool">⬛ Square</button>
                <button class="tool-btn" id="circleTool">⚪ Circle</button>
                <button class="tool-btn" id="textTool">🔤 Text</button>
            </div>
        </div>

        <!-- 🎨 Color Spectrum Selector -->
        <div>
            <div class="section-title">Color Palette</div>
            <input type="color" id="colorPicker" value="#2c3e50">
        </div>

        <!-- 🎚️ Dynamic Context Controls -->
        <div class="slider-group">
            <div class="section-title" style="display:flex; justify-content:space-between; margin-bottom:0;">
                <span>Brush Dimension</span>
                <span id="sizeVal">8px</span>
            </div>
            <input type="range" id="brushSize" min="1" max="100" value="8">
        </div>

        <!-- ✏️ Pencil Grade Setup Window -->
        <div class="select-group" id="pencilGradeGroup" style="display: none;">
            <div class="section-title">Lead Grade</div>
            <select id="pencilGrade">
                <option value="10H">10H (Hardest / Extra Light)</option>
                <option value="8H">8H</option>
                <option value="6H">6H</option>
                <option value="4H">4H</option>
                <option value="2H">2H</option>
                <option value="H">H</option>
                <option value="HB" selected>HB (Medium Balance)</option>
                <option value="B">B</option>
                <option value="2B">2B</option>
                <option value="4B">4B</option>
                <option value="6B">6B</option>
                <option value="8B">8B</option>
                <option value="10B">10B</option>
                <option value="12B">12B (Softest / Heavy Dark)</option>
            </select>
        </div>

        <!-- 🔤 Font Select Window -->
        <div class="select-group" id="fontSelectorGroup" style="display: none;">
            <div class="section-title">Typography Style</div>
            <select id="fontSelect">
                <option value="sans-serif">Standard Sans-Serif</option>
            </select>
        </div>

        <!-- 📂 Export Panel Actions -->
        <div class="file-actions">
            <div class="section-title">Workspace Data</div>
            <button class="action-btn" id="importBtn">📂 Import Photo</button>
            <input type="file" id="imageImporter" accept="image/*" style="display: none;">
            
            <div style="display: flex; gap: 4px;">
                <select id="exportFormat" style="flex: 1;">
                    <option value="image/png">PNG</option>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/webp">WEBP</option>
                </select>
                <button class="action-btn" id="exportBtn" style="flex: 1.5;">💾 Export</button>
            </div>
            <button class="action-btn" id="clearBtn">🗑️ Reset Canvas</button>
        </div>
    </div>

    <!-- 🖌️ Viewport Frame Display -->
    <div id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanas Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toolbar">
        <div class="logo">🍍 Nanas Engine</div>
        
        <!-- Shape and Text Engine Core Tools -->
        <div class="control-group">
            <button class="tool-btn active" id="brushTool">🖌️ Brush</button>
            <button class="tool-btn" id="squareTool">⬛ Square</button>
            <button class="tool-btn" id="circleTool">⭕ Circle</button>
            <button class="tool-btn" id="textTool">🔤 Text</button>
        </div>

        <div class="control-group">
            <label for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#4f46e5">
        </div>
        
        <div class="control-group">
            <label for="brushSize">Size:</label>
            <input type="range" id="brushSize" min="8" max="72" value="24">
            <span id="sizeVal">24px</span>
        </div>

        <button id="clearBtn" class="danger-btn">Clear Canvas</button>
    </div>

    <!-- The container holding both the rendering canvas and live editing fields -->
    <div id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>

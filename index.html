<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanas Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🗺️ Core Engine Viewport Container -->
    <div id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- 🎛️ Unified Command Bar / Floating Control Deck -->
    <div id="toolbar">
        
        <!-- 🍍 Nanas Engine Mini Brand Identity Icon -->
        <div id="logoContainer">
            <img src="logo.png" alt="Nanas Engine Logo" id="engineLogo">
        </div>

        <!-- 🛠️ Main Tool Execution Suite -->
        <div class="tool-section separator">
            <button id="brushTool" class="tool-btn active">🖌️ Brush</button>
            <button id="bucketTool" class="tool-btn">🪣 Bucket</button>
            <button id="squareTool" class="tool-btn">⬜ Square</button>
            <button id="circleTool" class="tool-btn">⭕ Circle</button>
            <button id="textTool" class="tool-btn">🔤 Text</button>
            <button id="eraserTool" class="tool-btn">🧼 Eraser</button>
            <button id="eyedropperTool" class="tool-btn">🧪 Eyedropper</button>
            <button id="lineTool" class="tool-btn">📏 Line</button>
        </div>

        <!-- 🎨 Vector Input Properties Panel -->
        <div class="tool-section separator">
            <input type="color" id="colorPicker" value="#000000" title="Select Tool Color">
            <div class="slider-group">
                <input type="range" id="brushSize" min="5" max="100" value="20">
                <span id="sizeVal">20px</span>
            </div>
        </div>

        <!-- 🔤 Typography Controller Module (Injected via JS loop engine) -->
        <div id="fontSelectorGroup" class="tool-section" style="display: none;">
            <label for="fontSelect">Font:</label>
            <select id="fontSelect">
                <option value="sans-serif">System Sans-Serif</option>
                <!-- Edo SZ option link initialized right here by app.js engine font face resolver -->
            </select>
        </div>

        <!-- 💾 File Management Terminal Section -->
        <div class="tool-section separator right-align">
            <!-- Hidden binary input link element for importing images natively -->
            <input type="file" id="imageImporter" accept="image/png, image/jpeg, image/webp" style="display: none;">
            <button id="importBtn" class="action-btn import-style">📂 Import</button>
            
            <div class="format-group">
                <select id="exportFormat" title="Bitmap Export Type Target">
                    <option value="image/png">.PNG (Lossless)</option>
                    <option value="image/jpeg">.JPG (Compressed)</option>
                    <option value="image/webp">.WEBP (Modern)</option>
                </select>
                <button id="exportBtn" class="action-btn export-style">💾 Export</button>
            </div>
            
            <button id="clearBtn" class="action-btn clear-style">🗑️ Clear</button>
        </div>
    </div>

    <!-- Core Engine Scripts -->
    <script src="app.js"></script>
</body>
</html>
